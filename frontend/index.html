<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <link id="app-manifest" rel="manifest" href="/manifest-bodagoera.webmanifest" />
    <link id="app-icon" rel="icon" type="image/jpeg" href="/images/bodagoera-apk.jpg" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/images/bodagoera-apk.jpg" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BodaGoEra" />
    <script>
      (function () {
        var supermarket = window.location.pathname.indexOf('/supermarketera') === 0 || new URLSearchParams(window.location.search).get('app') === 'supermarketera';
        var manifest = document.getElementById('app-manifest');
        if (manifest) manifest.setAttribute('href', supermarket ? '/manifest-supermarketera.webmanifest' : '/manifest-bodagoera.webmanifest');
        var appIcon = document.getElementById('app-icon');
        var appleIcon = document.getElementById('app-apple-icon');
        var iconPath = supermarket ? '/icons/supermarketera-192.png' : '/images/bodagoera-apk.jpg';
        if (appIcon) appIcon.setAttribute('href', iconPath);
        if (appleIcon) appleIcon.setAttribute('href', iconPath);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', supermarket ? '#33765b' : '#f97316');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', supermarket ? 'SupermartKera' : 'BodaGoEra');
        document.title = supermarket ? 'SupermartKera — Shop & Delivery' : 'BodaGoEra — Transport & Delivery';
      }());
    </script>

    <title>BodaGoEra - Your Trusted Ride Partner</title>

    <meta name="description" content="BodaGoEra - Transport and delivery app for Uganda with fair commission distribution" />
    <meta property="og:title" content="BodaGoEra" />
    <meta property="og:description" content="Your Trusted Ride Partner in Uganda" />
    <meta property="og:image" content="/images/hero-bodagoera.png" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
